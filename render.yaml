services:
  - type: web
    name: sec450-incident-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn delivery_app:create_app --factory --workers 1 --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: sec450-db
          property: connectionString
      - key: COURSE_TEST_DATABASE_URL
        fromDatabase:
          name: sec450-db
          property: connectionString
      # Separate generated schemas; never reset the product's public schema.
      - key: COURSE_TEST_ALLOW_SHARED_DATABASE
        value: "1"
      - key: PUBLIC_BASE_URL
        value: https://sec450-incident-api.onrender.com
databases:
  - name: sec450-db
    plan: free
    databaseName: sec450
    user: sec450
