services:
  - type: web
    name: sec450-incident-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: sec450-db
          property: connectionString
databases:
  - name: sec450-db
    plan: free
    databaseName: sec450
    user: sec450
