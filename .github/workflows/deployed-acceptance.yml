name: Deployed Acceptance Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run deployed acceptance checks
        run: python -m course_acceptance --output acceptance-results.json

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-acceptance-results
          path: acceptance-results.json
          if-no-files-found: warn
